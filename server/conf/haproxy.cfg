global
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:AES256-SHA:AES128-SHA256:AES256-SHA256
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http


#---------------------------------------------------------------------
# Frontend：HTTPS 443 端口
#---------------------------------------------------------------------
frontend https_in
	bind *:443 ssl crt /etc/haproxy/certs/api_server_combined.pem
	option forwardfor
	# 告诉后端应用（如 Portal 或 Admin）请求是通过 HTTPS 进来的
	http-request add-header X-Forwarded-Proto https

	# 微信平台域名验证
	acl is_wechat_verify path -i /MP_verify_AsWmjqUREJty1rV6.txt
	http-request return status 200 content-type "text/plain" string "AsWmjqUREJty1rV6" if is_wechat_verify
	
	acl is_wechat_verify_2 path -i /MP_verify_QjmFtxhbT6IeTaTp.txt
	http-request return status 200 content-type "text/plain" string "QjmFtxhbT6IeTaTp" if is_wechat_verify_2

	# 1. 拦截所有以常规文件名结尾的请求路径
	acl is_regular_file_requests path_end -i favicon.ico .php .jsp .htm .html .xml .txt .cfg .yml .yaml
	http-request deny deny_status 403 if is_regular_file_requests

	# 2. 路径穿越与敏感系统文件扫描 (如 /etc/passwd, .git 等)
	acl is_attack_path path_sub -i ..
	acl is_attack_path path_beg -i /.git/ /.vscode/ /idx_config/ /manager/ /cgi-bin/ /@fs/

	# 3. 敏感后缀与特定的开发/框架配置文件 (如 .env, .yml, .json, .md)
	acl is_sensitive_file path_end -i .env .ts .m3u8 .mp4 .mov .mp3 .env.save .env.backup .env.production .env.example .env.old .s3.env .env.local
	acl is_sensitive_file path_end -i docker-compose.yml docker-compose.yaml docker-compose.override.yml Dockerfile dockerfile
	acl is_sensitive_file path_end -i .clauderc claude.md CLAUDE.md CLAUDE.MD Claude.md CONTEXT.md PROMPT.md task.md
	acl is_sensitive_file path_end -i .DS_Store sftp.json auth.json config.yaml config.yml

	# 4. 乱撞的特定脚本与端点 (如 /server.go, /SDK/webLanguage, /login.action)
	acl is_bad_endpoint path -i /server.go /main.go /main.py /server.py /server.js /main.js /login.action /SDK/webLanguage /enter/index.html /telescope/requests

	# 5. 定义 WordPress 恶意扫描特征
	# 匹配以 wlwmanifest.xml 结尾的路径，或者包含 wp-includes / wp-admin / wp-content 的路径
	acl is_wordpress_scan path_end -i wlwmanifest.xml xmlrpc.php wp-login.php
	acl is_wordpress_scan path_sub -i /wp-includes/ /wp-content/ /wp-admin/


	# 6. 执行阻断策略：一旦命中上述任一规则，直接由 HAProxy 返回 403 Forbidden，不发给后端
	http-request deny status 403 if is_attack_path
	http-request deny status 403 if is_sensitive_file
	http-request deny status 403 if is_bad_endpoint
	http-request deny status 403 if is_wordpress_scan

	# 复制之前的 ACL 规则
	acl host_api     hdr_beg(host) -i api
	acl host_portal  hdr_beg(host) -i portal
	acl host_admin   hdr_beg(host) -i admin
	acl host_emqx    hdr_beg(host) -i emqx
	acl host_minio   hdr_beg(host) -i minio
	acl host_influx  hdr_beg(host) -i influxdb

	# ---- API 服务专属白名单过滤 ----
	# 判断请求是否去往其他已知服务 (非 API)
	acl is_other_service hdr_beg(host) -i portal admin emqx minio influxdb
	# API 服务的合法路径 (包含 /openapi.json 以保证 /docs 正常显示)
	acl is_valid_api_path_exact path -i /
	acl is_valid_api_path_prefix path_beg -i /api/v1 /docs /openapi.json
	# 拦截落入 API 服务且路径不合法的请求
	http-request deny status 403 if !is_other_service !is_valid_api_path_exact !is_valid_api_path_prefix
	# ---------------------------------

	use_backend backend_portal   if host_portal
	use_backend backend_admin    if host_admin
	use_backend backend_emqx     if host_emqx
	use_backend backend_minio    if host_minio
	use_backend backend_influxdb if host_influx
	use_backend backend_default  if host_api

    default_backend backend_default

#---------------------------------------------------------------------
# Frontend：统一监听 80 端口，按域名分发
#---------------------------------------------------------------------
frontend http_in
	bind *:80
	option forwardfor
	# 微信平台域名验证
	acl is_wechat_verify path -i /MP_verify_AsWmjqUREJty1rV6.txt
	http-request return status 200 content-type "text/plain" string "AsWmjqUREJty1rV6" if is_wechat_verify
	
	acl is_wechat_verify_2 path -i /MP_verify_QjmFtxhbT6IeTaTp.txt
	http-request return status 200 content-type "text/plain" string "QjmFtxhbT6IeTaTp" if is_wechat_verify_2

	# 1. 拦截所有以常规文件名结尾的请求路径
	acl is_regular_file_requests path_end -i .php .jsp .htm .html .xml .txt .cfg .yml .yaml
	http-request deny deny_status 403 if is_regular_file_requests

	# 2. 路径穿越与敏感系统文件扫描 (如 /etc/passwd, .git 等)
	acl is_attack_path path_sub -i ..
	acl is_attack_path path_beg -i /.git/ /.vscode/ /idx_config/ /manager/ /cgi-bin/ /@fs/

	# 3. 敏感后缀与特定的开发/框架配置文件 (如 .env, .yml, .json, .md)
	acl is_sensitive_file path_end -i .env .env.save .env.backup .env.production .env.example .env.old .s3.env .env.local
	acl is_sensitive_file path_end -i docker-compose.yml docker-compose.yaml docker-compose.override.yml Dockerfile dockerfile
	acl is_sensitive_file path_end -i .clauderc claude.md CLAUDE.md CLAUDE.MD Claude.md CONTEXT.md PROMPT.md task.md
	acl is_sensitive_file path_end -i .DS_Store sftp.json auth.json config.yaml config.yml

	# 4. 乱撞的特定脚本与端点 (如 /server.go, /SDK/webLanguage, /login.action)
	acl is_bad_endpoint path -i /server.go /main.go /main.py /server.py /server.js /main.js /login.action /SDK/webLanguage /enter/index.html /telescope/requests

	# 5. 定义 WordPress 恶意扫描特征
	# 匹配以 wlwmanifest.xml 结尾的路径，或者包含 wp-includes / wp-admin / wp-content 的路径
	acl is_wordpress_scan path_end -i wlwmanifest.xml xmlrpc.php wp-login.php
	acl is_wordpress_scan path_sub -i /wp-includes/ /wp-content/ /wp-admin/


	# 6. 执行阻断策略：一旦命中上述任一规则，直接由 HAProxy 返回 403 Forbidden，不发给后端
	http-request deny status 403 if is_attack_path
	http-request deny status 403 if is_sensitive_file
	http-request deny status 403 if is_bad_endpoint
	http-request deny status 403 if is_wordpress_scan

	# 1. 拦截 Let's Encrypt 的 ACME 验证请求并转发给 Certbot
	acl is_certbot path_beg /.well-known/acme-challenge/
	
	# 按域名前缀匹配（域名中只要包含这些关键字即可）
	acl host_api     hdr_beg(host) -i api
	acl host_portal  hdr_beg(host) -i portal
	acl host_admin   hdr_beg(host) -i admin
	acl host_emqx    hdr_beg(host) -i emqx
	acl host_minio   hdr_beg(host) -i minio
	acl host_influx  hdr_beg(host) -i influxdb

	# ---- API 服务专属白名单过滤 ----
	acl is_other_service hdr_beg(host) -i portal admin emqx minio influxdb
	acl is_valid_api_path_exact path -i /
	acl is_valid_api_path_prefix path_beg -i /api/v1 /docs /openapi.json
	# 拦截落入 API 服务的非法路径请求（需放行 Let's Encrypt 的验证）
	http-request deny status 403 if !is_other_service !is_valid_api_path_exact !is_valid_api_path_prefix !is_certbot
	# ---------------------------------

	use_backend certbot_backend if is_certbot
	use_backend backend_portal   if host_portal
	use_backend backend_admin    if host_admin
	use_backend backend_emqx     if host_emqx
	use_backend backend_minio    if host_minio
	use_backend backend_influxdb if host_influx
	use_backend backend_default  if host_api

	# 默认流量 → 3011
	default_backend backend_default

#---------------------------------------------------------------------
# Backends
#---------------------------------------------------------------------
backend backend_default
	server local 127.0.0.1:3011 check

backend backend_portal
	server local 127.0.0.1:3021 check

backend backend_admin
	server local 127.0.0.1:3022 check

backend backend_emqx
	server local 127.0.0.1:18083 check

backend backend_minio
	server local 127.0.0.1:9001 check

backend backend_influxdb
	server local 127.0.0.1:8086 check

backend certbot_backend
    server certbot 127.0.0.1:8888

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
