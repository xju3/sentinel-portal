[project]
name = "persistence"
version = "0.1.0"
description = "Persistence Microservice for storing raw diagnostic reports to MySQL and InfluxDB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "anyio>=4,<5",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy>=2.0.36",
    "pymysql[rsa]==1.1.0",
    "redis==5.0.1",
    "influxdb-client==1.18.0",
    "minio==7.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "aiofiles==23.2.1",
    "httpx==0.25.2",
    "aiomysql>=0.3.2",
    "greenlet>=3.5.0",
    "cryptography>=48.0.0",
    "orjson>=3.11.9",
    "pub",
]

[tool.uv]
managed = true
package = false

[project.scripts]
start = "app.main:start_server"

[tool.uv.sources]
pub = { workspace = true }
