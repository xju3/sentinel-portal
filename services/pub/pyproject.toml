[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pub"
version = "0.1.0"
description = "Shared data access layer for Sentinel platform services"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Sentinel Team"},
]

dependencies = [
    "sqlalchemy>=2.0.36",
    "pymysql[rsa]==1.1.0",
    "redis==5.0.1",
    "influxdb-client==1.18.0",
    "minio==7.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "aiomysql>=0.3.2",
    "greenlet>=3.5.0",
    "cryptography>=48.0.0",
    "protobuf>=6.33.6",
    "pandas>=3.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pub"]

[tool.uv]
managed = true
package = false