x-python-env: &python-env
  UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
  UV_LINK_MODE: copy
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: "Asia/Shanghai"

x-python-app: &python-app
  image: ${PYTHON_IMAGE:-python:3.14-slim}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  working_dir: /app/server
  env_file:
    - ../server/.env
  command: >
    sh -c "pip install uv -i $${UV_INDEX_URL} && uv sync --package $${APP_PACKAGE} --no-dev && uv run --package $${APP_PACKAGE} python -m uvicorn app.main:app --app-dir /app/server/$${APP_PACKAGE} --host 0.0.0.0 --port 8000 --reload --reload-dir /app/server/$${APP_PACKAGE}/app --reload-dir /app/server/pub/src"

services:
  api:
    <<: *python-app
    container_name: stl-api
    environment:
      <<: *python-env
      APP_PACKAGE: api
    ports:
      - "3011:8000"
    volumes:
      - ../server:/app/server
      - api_venv:/app/server/.venv

  dia:
    <<: *python-app
    container_name: stl-dia
    environment:
      <<: *python-env
      APP_PACKAGE: diagnosis
    ports:
      - "3012:8000"
    volumes:
      - ../server:/app/server
      - dia_venv:/app/server/.venv

  persistence:
    <<: *python-app
    container_name: stl-persistence
    environment:
      <<: *python-env
      APP_PACKAGE: persistence
    ports:
      - "3013:8000"
    volumes:
      - ../server:/app/server
      - persistence_venv:/app/server/.venv

  portal:
    container_name: stl-portal
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      args:
        APP_NAME: portal
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    ports:
      - "3021:80"
    depends_on:
      - api
    environment:
      TZ: "Asia/Shanghai"

  admin:
    container_name: stl-admin
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      args:
        APP_NAME: admin
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    ports:
      - "3022:80"
    depends_on:
      - api
    environment:
      TZ: "Asia/Shanghai"
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: on-failure
  redis:
    container_name: redis
    image: redis:latest
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - redis_conf:/etc/redis
    environment:
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
      - TZ=Asia/Shanghai
    restart: on-failure
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    ports:
      - "7009:7009" # 暴露给 ESP32-S3 发送 HTTP POST 请求的端口
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 将当前目录下的配置文件只读挂载到容器内
      - telegraf_conf:/etc/telegraf:ro
    depends_on:
      - influxdb # 确保 InfluxDB 先启动
    restart: always
  influxdb:
    image: influxdb:2.7 # Pinned to a specific 2.x version for stability
    container_name: influxdb2
    restart: unless-stopped
    ports:
      - "8086:8086" # Default InfluxDB UI and API port
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-myorg}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-mybucket}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-mytoken}
      TZ: "Asia/Shanghai"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_conf:/etc/influxdb2
  emqx:
    image: emqx/emqx:5.4.1
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "18083:18083"
    environment:
      - "EMQX_DASHBOARD__ADMIN_PASSWORD=${EMQX_DASHBOARD__ADMIN_PASSWORD:-admin123}"
      - "TZ=Asia/Shanghai"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/log
    restart: always
  mysql:
    image: mysql:8.0.34
    restart: always
    container_name: mysql8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sentinel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-sentinel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: 'Asia/Shanghai'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - mysql_logs:/var/log/mysql
      - mysql_data:/var/lib/mysql
      - mysql_conf:/etc/mysql/conf.d/my.cnf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    privileged: true
volumes:
  api_venv:
  dia_venv:
  persistence_venv:
  minio_logs:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/minio/logs
      o: bind
  minio_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/minio/data
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/redis/data
      o: bind
  redis_conf:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/redis/conf
      o: bind
  emqx_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/emqx/data
      o: bind
  emqx_logs:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/emqx/logs
      o: bind
  mysql_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/mysql/data
      o: bind
  mysql_conf:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/mysql/conf
      o: bind
  mysql_logs:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/mysql/logs
      o: bind
  influxdb_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/influxdb/data
      o: bind
  influxdb_conf:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/influxdb/conf
      o: bind
  influxdb_logs:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/influxdb/logs
      o: bind
  telegraf_conf:
    driver: local
    driver_opts:
      type: none
      device: /opt/docker/telegraf/conf
      o: bind
