x-python-app: &python-app
  image: ${PYTHON_IMAGE:-python:3.14-slim}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    UV_LINK_MODE: copy
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../apps:/app/apps

x-node-app: &node-app
  image: node:22-alpine
  restart: unless-stopped
  environment:
    API_PROXY_TARGET: http://api:8000
    CHOKIDAR_USEPOLLING: "true"
    WATCHPACK_POLLING: "true"

services:
  api:
    <<: *python-app
    container_name: sentinel-api
    working_dir: /app/apps/api
    env_file:
      - ../apps/api/.env
    command: >
      sh -c "pip install uv -i $${UV_INDEX_URL} &&
      uv sync --no-dev &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/apps/api/app --reload-dir /app/apps/pub/src"
    ports:
      - "3090:8000"
    volumes:
      - ../apps:/app/apps
      - api_venv:/app/apps/.venv

  dia:
    <<: *python-app
    container_name: sentinel-dia
    working_dir: /app/apps/dia
    env_file:
      - ../apps/dia/.env
    command: >
      sh -c "pip install uv -i $${UV_INDEX_URL} &&
      uv sync --no-dev &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/apps/dia/app --reload-dir /app/apps/pub/src"
    ports:
      - "3091:8000"
    volumes:
      - ../apps:/app/apps
      - dia_venv:/app/apps/.venv

  portal:
    <<: *node-app
    container_name: sentinel-portal
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../web/portal:/app
      - portal_node_modules:/app/node_modules
    ports:
      - "3010:8000"
    depends_on:
      - api

  admin:
    <<: *node-app
    container_name: sentinel-admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../web/admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "3020:8000"
    depends_on:
      - api

volumes:
  api_venv:
  dia_venv:
  portal_node_modules:
  admin_node_modules:
