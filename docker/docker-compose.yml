x-python-app: &python-app
  image: ${PYTHON_IMAGE:-python:3.14-slim}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    UV_LINK_MODE: copy
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../svr:/app/svr

x-node-app: &node-app
  image: node:22-alpine
  restart: unless-stopped
  environment:
    API_PROXY_TARGET: http://api:8000
    CHOKIDAR_USEPOLLING: "true"
    WATCHPACK_POLLING: "true"

services:
  api:
    <<: *python-app
    container_name: stl-api
    working_dir: /app/svr/api
    env_file:
      - ../.env
    command: >
      sh -c "pip install uv -i $${UV_INDEX_URL} &&
      uv sync --no-dev &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/svr/api/app --reload-dir /app/svr/pub/src"
    ports:
      - "3090:8000"
    volumes:
      - ../svr:/app/svr
      - api_venv:/app/svr/.venv

  dia:
    <<: *python-app
    container_name: stl-dia
    working_dir: /app/svr/dia
    env_file:
      - ../.env
    command: >
      sh -c "pip install uv -i $${UV_INDEX_URL} &&
      uv sync --no-dev &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/svr/dia/app --reload-dir /app/svr/pub/src"
    ports:
      - "3091:8000"
    volumes:
      - ../svr:/app/svr
      - dia_venv:/app/svr/.venv

  tenant:
    <<: *node-app
    container_name: stl-tenant
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../web/tenant:/app
      - tenant_node_modules:/app/node_modules
    ports:
      - "3010:8000"
    depends_on:
      - api

  admin:
    <<: *node-app
    container_name: stl-admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../web/admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "3020:8000"
    depends_on:
      - api

volumes:
  api_venv:
  dia_venv:
  tenant_node_modules:
  admin_node_modules:
