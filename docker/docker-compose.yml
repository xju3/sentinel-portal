x-python-app: &python-app
  image: ${PYTHON_IMAGE:-python:3.14-slim}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    UV_LINK_MODE: copy
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    TZ: "Asia/Shanghai"
  volumes:
    - ../server:/app/server

services:
  api:
    <<: *python-app
    container_name: stl-api
    working_dir: /app/server/api
    env_file:
      - ../.env
    command: >
      sh -c "pip install uv -i $${UV_INDEX_URL} &&
      uv sync --no-dev &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/server/api/app --reload-dir /app/server/pub/src"
    ports:
      - "3090:8000"
    volumes:
      - ../server:/app/server
      - api_venv:/app/server/.venv

  dia:
    <<: *python-app
    container_name: stl-dia
    working_dir: /app/server/dia
    env_file:
      - ../.env
    command: >
      sh -c "pip install uv -i $${UV_INDEX_URL} &&
      uv sync --no-dev &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/server/dia/app --reload-dir /app/server/pub/src"
    ports:
      - "3091:8000"
    volumes:
      - ../server:/app/server
      - dia_venv:/app/server/.venv

  tenant:
    container_name: stl-tenant
    build:
      context: ..
      dockerfile: docker/tenant/Dockerfile
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - api
    environment:
      TZ: "Asia/Shanghai"

  admin:
    container_name: stl-admin
    build:
      context: ..
      dockerfile: docker/admin/Dockerfile
    restart: unless-stopped
    ports:
      - "3020:80"
    depends_on:
      - api
    environment:
      TZ: "Asia/Shanghai"

volumes:
  api_venv:
  dia_venv:
