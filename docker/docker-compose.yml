services:
  api:
    build:
      context: ../
      dockerfile: docker/api/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    container_name: api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../services/api/.env
    ports:
      - "3090:8000"
    volumes:
      - ../services/api/app:/app/services/api/app   # 挂载源码
      - ../services/pub:/app/services/pub           # 挂载共享 pub 模块

  portal:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    volumes:
      - ../clients/portal:/app
    ports:
      - "3010:80"

  admin:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    volumes:
      - ../clients/admin:/app
    ports:
      - "3020:80"