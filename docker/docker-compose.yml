x-python-env: &python-env
  UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
  UV_LINK_MODE: copy
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: "Asia/Shanghai"

x-python-app: &python-app
  image: ${PYTHON_IMAGE:-python:3.14-slim}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  working_dir: /app/server
  env_file:
    - ../.env
  command: >
    sh -c "pip install uv -i $${UV_INDEX_URL} &&
    uv sync --package $${APP_PACKAGE} --no-dev &&
    uv run --package $${APP_PACKAGE} python -m uvicorn app.main:app
    --app-dir /app/server/$${APP_PACKAGE}
    --host 0.0.0.0 --port 8000 --reload
    --reload-dir /app/server/$${APP_PACKAGE}/app --reload-dir /app/server/pub/src"

services:
  api:
    <<: *python-app
    container_name: stl-api
    environment:
      <<: *python-env
      APP_PACKAGE: api
    ports:
      - "3090:8000"
    volumes:
      - ../server:/app/server
      - api_venv:/app/server/.venv

  dia:
    <<: *python-app
    container_name: stl-dia
    environment:
      <<: *python-env
      APP_PACKAGE: dia
    ports:
      - "3091:8000"
    volumes:
      - ../server:/app/server
      - dia_venv:/app/server/.venv

  tenant:
    container_name: stl-tenant
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      args:
        APP_NAME: tenant
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - api
    environment:
      TZ: "Asia/Shanghai"

  admin:
    container_name: stl-admin
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      args:
        APP_NAME: admin
    restart: unless-stopped
    ports:
      - "3020:80"
    depends_on:
      - api
    environment:
      TZ: "Asia/Shanghai"

volumes:
  api_venv:
  dia_venv:
