[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-portal-api"
version = "0.1.0"
description = "Sensor Portal API - FastAPI backend for sensor data management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Portal Team"},
]
keywords = ["sensor", "api", "fastapi", "influxdb", "mysql", "redis", "minio"]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "pymysql==1.1.0",
    "redis==5.0.1",
    "influxdb-client==1.18.0",
    "minio==7.2.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "aiofiles==23.2.1",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
]

[project.optional-dependencies]
dev = [
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "pytest-cov==4.1.0",
]

[tool.uv]
managed = true
package = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
